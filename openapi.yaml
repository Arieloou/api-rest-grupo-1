openapi: 3.0.3
info:
  title: API de Gestión de Pedidos
  version: 1.0.0
  description: API REST para registrar y consultar pedidos de clientes.
  contact:
    name: Equipo de Integración
servers:
  - url: http://localhost:5237
    description: Entorno local
tags:
  - name: Orders
    description: Operaciones sobre pedidos
paths:
  /orders:
    get:
      tags: [Orders]
      summary: Consultar pedidos
      description: Retorna todos los pedidos o los filtra por cliente.
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: customerId
          in: query
          required: false
          description: Identificador del cliente por el cual se filtran los pedidos.
          schema:
            type: string
            pattern: '^C-[0-9]+$'
          example: C-1024
      responses:
        '200':
          description: Lista de pedidos encontrada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: O-9831
                  customerId: C-1024
                  status: CREATED
                  total: 129.90
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Orders]
      summary: Crear un pedido
      description: Valida la disponibilidad de los productos y registra un pedido nuevo.
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customerId: C-1024
              items:
                - productId: P-500
                  quantity: 2
      responses:
        '201':
          description: Pedido creado.
          headers:
            Location:
              description: URL del pedido creado.
              schema:
                type: string
                format: uri-reference
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: O-9831
                customerId: C-1024
                status: CREATED
                total: 129.90
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Uno de los productos no existe o no tiene inventario suficiente.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PRODUCT_NOT_AVAILABLE
                message: Product P-500 does not have sufficient stock.
                correlationId: ab23f8b1-91c2-45dc
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Consultar un pedido por ID
      operationId: getOrderById
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: orderId
          in: path
          required: true
          description: Identificador único del pedido.
          schema:
            type: string
            pattern: '^O-[0-9]+$'
          example: O-9831
      responses:
        '200':
          description: Pedido encontrado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Pedido no encontrado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ORDER_NOT_FOUND
                message: Order O-9831 was not found.
                correlationId: ab23f8b1-91c2-45dc
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador opcional para rastrear una solicitud de extremo a extremo.
      schema:
        type: string
      example: ab23f8b1-91c2-45dc
  headers:
    CorrelationId:
      description: Identificador utilizado para rastrear la solicitud.
      schema:
        type: string
  responses:
    BadRequest:
      description: La solicitud contiene datos inválidos.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REQUEST
            message: The request contains invalid data.
            correlationId: ab23f8b1-91c2-45dc
            details:
              Items:
                - At least one item is required.
    InternalError:
      description: Error inesperado del servidor.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: An unexpected error occurred.
            correlationId: ab23f8b1-91c2-45dc
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [customerId, items]
      properties:
        customerId:
          type: string
          pattern: '^C-[0-9]+$'
          example: C-1024
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'
    CreateOrderItem:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId:
          type: string
          pattern: '^P-[0-9]+$'
          example: P-500
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          example: 2
    Order:
      type: object
      additionalProperties: false
      required: [id, customerId, status, total]
      properties:
        id:
          type: string
          pattern: '^O-[0-9]+$'
          example: O-9831
        customerId:
          type: string
          pattern: '^C-[0-9]+$'
          example: C-1024
        status:
          type: string
          enum: [CREATED]
          example: CREATED
        total:
          type: number
          format: decimal
          minimum: 0
          multipleOf: 0.01
          example: 129.90
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          description: Código estable y legible por máquinas.
          example: PRODUCT_NOT_AVAILABLE
        message:
          type: string
          description: Descripción legible del error.
          example: Product P-500 does not have sufficient stock.
        correlationId:
          type: string
          description: Identificador para diagnóstico y trazabilidad.
          example: ab23f8b1-91c2-45dc
        details:
          type: object
          description: Errores por campo; solo se incluye cuando aplica.
          additionalProperties:
            type: array
            items:
              type: string
